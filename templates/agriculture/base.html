{% load static %}

<!DOCTYPE html>
<html lang="{{ language|default:'en' }}">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1d6b39"
    >

    <title>
        {% block title %}
            PENTRAONE Agriculture
        {% endblock %}
    </title>


    <style>

        /* =========================================================
           AGRICULTURE THEME
        ========================================================= */

        :root {

            --agri-bg: #f4f8f3;

            --agri-surface: #ffffff;

            --agri-surface-2: #eef7ef;

            --agri-text: #12351d;

            --agri-muted: #647467;

            --agri-green: #21813f;

            --agri-green-2: #17652f;

            --agri-border: #dbe7dc;

            --agri-shadow:
                0 18px 50px rgba(25,76,37,.08);

            --agri-radius: 22px;

            --agri-max: 1180px;

            --agri-accent: #e6f3e8;

            --agri-gold: #f5c95b;

        }


        /* =========================================================
           DARK MODE — DEEPER / DARKER
        ========================================================= */

        body.dark {

            --agri-bg: #040704;

            --agri-surface: #080d09;

            --agri-surface-2: #0d160f;

            --agri-text: #edf8ef;

            --agri-muted: #98a99c;

            --agri-green: #69d27c;

            --agri-green-2: #55bd69;

            --agri-border: #1c2b20;

            --agri-shadow:
                0 24px 65px rgba(0,0,0,.55);

            --agri-accent: #102116;

        }


        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background:
                var(--agri-bg);

            color:
                var(--agri-text);

            line-height: 1.6;

            transition:
                background 1s ease,
                color .75s ease;

            overflow-x: hidden;
        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: .35;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(123,192,132,.13),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    rgba(244,201,89,.09),
                    transparent 24%
                );

            z-index: -1;

            transition:
                opacity 1s ease;
        }


        body.dark::before {

            opacity: .08;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(70,130,80,.10),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(30,80,45,.08),
                    transparent 30%
                );
        }


        a {

            color: inherit;

            text-decoration: none;
        }


        button,
        input,
        textarea,
        select {

            font: inherit;
        }


        img {

            max-width: 100%;

            display: block;
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .agri-page {

            width:
                min(
                    var(--agri-max),
                    92%
                );

            margin:
                0 auto;

            padding:
                42px 0 70px;
        }


        .agri-narrow {

            max-width: 900px;

            margin:
                0 auto;
        }


        /* =========================================================
           HERO
        ========================================================= */

        .agri-hero {

            position: relative;

            overflow: hidden;

            margin-top: 10px;

            padding: 42px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #eaf6eb,
                    #f7fbf6
                );

            border:
                1px solid var(--agri-border);

            box-shadow:
                var(--agri-shadow);

            transition:
                background 1s ease,
                border-color .7s ease,
                box-shadow .7s ease;
        }


        body.dark .agri-hero {

            background:
                linear-gradient(
                    135deg,
                    #09140b,
                    #060c08
                );
        }


        .agri-hero::after {

            content: "";

            position: absolute;

            width: 260px;

            height: 260px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.28);

            right: -90px;

            top: -110px;

            transition:
                opacity .8s ease;
        }


        body.dark .agri-hero::after {

            opacity: .03;
        }


        .agri-eyebrow {

            display:
                inline-flex;

            gap: 8px;

            align-items: center;

            padding:
                8px 12px;

            border-radius:
                999px;

            background:
                var(--agri-accent);

            color:
                var(--agri-green-2);

            font-size:
                13px;

            font-weight:
                800;

            position:
                relative;

            z-index: 1;
        }


        .agri-title {

            font-size:
                clamp(
                    34px,
                    5vw,
                    56px
                );

            line-height:
                1.08;

            margin:
                16px 0 10px;

            position:
                relative;

            z-index:
                1;
        }


        .agri-lead {

            max-width:
                760px;

            color:
                var(--agri-muted);

            font-size:
                17px;

            position:
                relative;

            z-index:
                1;
        }


        /* =========================================================
           SECTION
        ========================================================= */

        .agri-section-head {

            display:
                flex;

            align-items:
                end;

            justify-content:
                space-between;

            gap:
                16px;

            margin:
                46px 0 18px;
        }


        .agri-section-head h2 {

            margin:
                0;

            font-size:
                28px;
        }


        .agri-section-head p {

            margin:
                5px 0 0;

            color:
                var(--agri-muted);

            font-size:
                14px;
        }


        /* =========================================================
           GRID / CARDS
        ========================================================= */

        .agri-grid {

            display:
                grid;

            grid-template-columns:
                repeat(3,1fr);

            gap:
                18px;
        }


        .agri-card {

            background:
                var(--agri-surface);

            border:
                1px solid var(--agri-border);

            border-radius:
                20px;

            box-shadow:
                var(--agri-shadow);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .45s ease,
                background .7s ease;
            
            overflow:
                hidden;
        }


        .agri-card:hover {

            transform:
                translateY(-7px);

            box-shadow:
                0 25px 50px
                rgba(31,80,38,.12);
        }


        body.dark .agri-card:hover {

            box-shadow:
                0 25px 55px
                rgba(0,0,0,.48);
        }


        .agri-card-body {

            padding:
                20px;
        }


        .agri-card h3 {

            margin:
                0 0 8px;

            font-size:
                19px;
        }


        .agri-card p {

            color:
                var(--agri-muted);

            font-size:
                14px;

            margin:
                0;
        }


        .agri-card-link {

            display:
                inline-flex;

            margin-top:
                15px;

            color:
                var(--agri-green-2);

            font-weight:
                800;

            transition:
                transform .2s ease;
        }


        .agri-card:hover
        .agri-card-link {

            transform:
                translateX(4px);
        }


        /* =========================================================
           VISUAL CARDS
        ========================================================= */

        .agri-visual {

            height:
                170px;

            display:
                grid;

            place-items:
                center;

            font-size:
                52px;

            background:
                linear-gradient(
                    135deg,
                    #d8efd9,
                    #a7cda9
                );

            position:
                relative;

            overflow:
                hidden;
        }


        body.dark .agri-visual {

            background:
                linear-gradient(
                    135deg,
                    #102217,
                    #09140d
                );
        }


        .agri-visual::before,
        .agri-visual::after {

            content:
                "";

            position:
                absolute;

            border-radius:
                50%;

            background:
                rgba(255,255,255,.2);
        }


        .agri-visual::before {

            width:
                180px;

            height:
                180px;

            right:
                -70px;

            top:
                -80px;
        }


        .agri-visual::after {

            width:
                130px;

            height:
                130px;

            left:
                -45px;

            bottom:
                -65px;
        }


        .agri-visual .agri-icon {

            position:
                relative;

            z-index:
                1;

            width:
                82px;

            height:
                82px;

            border-radius:
                26px;

            display:
                grid;

            place-items:
                center;

            background:
                rgba(255,255,255,.82);

            box-shadow:
                0 10px 25px
                rgba(0,0,0,.08);
        }


        .agri-visual.problem {

            background:
                linear-gradient(
                    135deg,
                    #f0e5cb,
                    #d7bd7a
                );
        }


        .agri-visual.weather {

            background:
                linear-gradient(
                    135deg,
                    #d6ecf6,
                    #8dbed8
                );
        }


        .agri-visual.schemes {

            background:
                linear-gradient(
                    135deg,
                    #ebe1cd,
                    #bda781
                );
        }


        .agri-visual.resources {

            background:
                linear-gradient(
                    135deg,
                    #e5e1f3,
                    #b8add8
                );
        }


        /* =========================================================
           QUICK CARDS
        ========================================================= */

        .agri-quick {

            display:
                grid;

            grid-template-columns:
                repeat(2,1fr);

            gap:
                16px;
        }


        .agri-quick-item {

            display:
                flex;

            align-items:
                center;

            gap:
                14px;

            padding:
                18px;

            background:
                var(--agri-surface);

            border:
                1px solid var(--agri-border);

            border-radius:
                18px;

            box-shadow:
                var(--agri-shadow);

            transition:
                transform .25s ease,
                background .6s ease,
                border-color .5s ease;
        }


        .agri-quick-item:hover {

            transform:
                translateY(-5px);
        }


        .agri-quick-icon {

            width:
                50px;

            height:
                50px;

            border-radius:
                15px;

            background:
                var(--agri-accent);

            display:
                grid;

            place-items:
                center;

            font-size:
                25px;
        }


        .agri-quick-item .grow {

            flex:
                1;
        }


        .agri-quick-item h3 {

            margin:
                0 0 4px;

            font-size:
                17px;
        }


        .agri-quick-item p {

            margin:
                0;

            color:
                var(--agri-muted);

            font-size:
                13px;
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .agri-btn {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            padding:
                11px 16px;

            border:
                0;

            border-radius:
                12px;

            background:
                var(--agri-green);

            color:
                #fff;

            font-weight:
                800;

            cursor:
                pointer;

            transition:
                transform .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }


        .agri-btn:hover {

            transform:
                translateY(-2px);

            background:
                var(--agri-green-2);

            box-shadow:
                0 10px 20px
                rgba(33,129,63,.18);
        }


        .agri-btn.ghost {

            background:
                var(--agri-accent);

            color:
                var(--agri-green-2);

            border:
                1px solid var(--agri-border);

            box-shadow:
                none;
        }


        /* =========================================================
           CROP GRID
        ========================================================= */

        .agri-crop-grid {

            display:
                grid;

            grid-template-columns:
                repeat(4,1fr);

            gap:
                16px;
        }


        .agri-crop-card {

            background:
                var(--agri-surface);

            border:
                1px solid var(--agri-border);

            border-radius:
                18px;

            overflow:
                hidden;

            box-shadow:
                0 10px 30px
                rgba(25,76,37,.06);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .35s ease,
                background .6s ease;
        }


        .agri-crop-card:hover {

            transform:
                translateY(-6px);

            box-shadow:
                0 18px 34px
                rgba(25,76,37,.11);
        }


        body.dark .agri-crop-card:hover {

            box-shadow:
                0 20px 40px
                rgba(0,0,0,.42);
        }


        .agri-crop-image {

            height:
                170px;

            background:
                var(--agri-accent);

            overflow:
                hidden;
        }


        .agri-crop-image img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;
        }


        .agri-crop-placeholder {

            height:
                100%;

            display:
                grid;

            place-items:
                center;

            font-size:
                50px;
        }


        .agri-crop-body {

            padding:
                16px;
        }


        .agri-crop-body h3 {

            margin:
                0;

            font-size:
                18px;
        }


        .agri-crop-body small {

            color:
                var(--agri-muted);

            display:
                block;

            margin-top:
                4px;
        }


        .agri-search {

            width:
                240px;

            max-width:
                100%;

            padding:
                11px 13px;

            border:
                1px solid var(--agri-border);

            border-radius:
                12px;

            background:
                var(--agri-surface);

            color:
                var(--agri-text);

            outline:
                0;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .6s ease;
        }


        .agri-search:focus {

            border-color:
                var(--agri-green);

            box-shadow:
                0 0 0 4px
                rgba(33,129,63,.10);
        }


        /* =========================================================
           DETAIL
        ========================================================= */

        .agri-detail-card {

            background:
                var(--agri-surface);

            border:
                1px solid var(--agri-border);

            border-radius:
                24px;

            box-shadow:
                var(--agri-shadow);

            padding:
                28px;

            margin-top:
                24px;
        }


        .agri-back {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            color:
                var(--agri-green-2);

            font-weight:
                800;

            margin-bottom:
                10px;
        }


        .agri-detail-header {

            display:
                grid;

            grid-template-columns:
                1.2fr .8fr;

            gap:
                24px;

            align-items:
                stretch;
        }


        .agri-detail-image {

            min-height:
                310px;

            border-radius:
                20px;

            overflow:
                hidden;

            background:
                var(--agri-accent);
        }


        .agri-detail-image img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;
        }


        .agri-detail-placeholder {

            height:
                100%;

            min-height:
                310px;

            display:
                grid;

            place-items:
                center;

            font-size:
                78px;
        }


        .agri-detail-copy h1 {

            font-size:
                42px;

            line-height:
                1.1;

            margin:
                0 0 8px;
        }


        .agri-scientific {

            color:
                var(--agri-muted);

            font-style:
                italic;

            margin-bottom:
                16px;
        }


        .agri-info-grid {

            display:
                grid;

            grid-template-columns:
                repeat(2,1fr);

            gap:
                14px;

            margin-top:
                22px;
        }


        .agri-info-card {

            background:
                var(--agri-surface-2);

            border:
                1px solid var(--agri-border);

            border-radius:
                16px;

            padding:
                16px;

            transition:
                transform .2s ease,
                background .6s ease;
        }


        .agri-info-card:hover {

            transform:
                translateY(-3px);
        }


        .agri-info-card h3 {

            margin:
                0 0 5px;

            font-size:
                15px;

            color:
                var(--agri-green-2);
        }


        .agri-info-card p {

            margin:
                0;

            color:
                var(--agri-muted);

            font-size:
                14px;
        }


        .agri-cta {

            margin-top:
                20px;

            padding:
                22px;

            border-radius:
                18px;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #f5fbf5
                );

            border:
                1px solid var(--agri-border);

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;
        }


        body.dark .agri-cta {

            background:
                linear-gradient(
                    135deg,
                    #0d1b11,
                    #07100a
                );
        }


        .agri-cta h2 {

            margin:
                0 0 4px;

            font-size:
                21px;
        }


        .agri-cta p {

            margin:
                0;

            color:
                var(--agri-muted);

            font-size:
                14px;
        }


        /* =========================================================
           WEATHER
        ========================================================= */

        .agri-weather-hero {

            display:
                grid;

            grid-template-columns:
                1.2fr .8fr;

            gap:
                20px;

            align-items:
                stretch;
        }


        .agri-weather-art {

            min-height:
                260px;

            border-radius:
                22px;

            overflow:
                hidden;

            background:
                linear-gradient(
                    135deg,
                    #bcdff0,
                    #e9f5fb
                );

            display:
                grid;

            place-items:
                center;

            font-size:
                100px;

            position:
                relative;
        }


        .agri-weather-art::after {

            content:
                "";

            position:
                absolute;

            width:
                280px;

            height:
                280px;

            border-radius:
                50%;

            background:
                rgba(255,255,255,.24);

            right:
                -100px;

            top:
                -100px;
        }


        .agri-location-panel {

            background:
                var(--agri-surface);

            border:
                1px solid var(--agri-border);

            border-radius:
                22px;

            padding:
                24px;

            box-shadow:
                var(--agri-shadow);
        }


        .agri-location-actions {

            display:
                flex;

            gap:
                10px;

            align-items:
                stretch;

            margin-top:
                18px;
        }


        .agri-search-row {

            display:
                flex;

            gap:
                10px;

            flex:
                1;
        }


        .agri-search-row input {

            flex:
                1;
        }


        .agri-status {

            min-height:
                24px;

            margin-top:
                12px;

            color:
                var(--agri-muted);

            font-size:
                13px;
        }


        .agri-results {

            display:
                grid;

            gap:
                9px;

            margin-top:
                10px;
        }


        .agri-result {

            display:
                block;

            width:
                100%;

            text-align:
                left;

            padding:
                13px 15px;

            border-radius:
                14px;

            border:
                1px solid var(--agri-border);

            background:
                var(--agri-surface-2);

            color:
                var(--agri-text);

            cursor:
                pointer;
        }


        .agri-result:hover {

            border-color:
                #a6c9aa;
        }


        .agri-result strong,
        .agri-result small {

            display:
                block;
        }


        .agri-result small {

            color:
                var(--agri-muted);

            margin-top:
                4px;
        }


        .agri-error {

            display:
                none;

            margin-top:
                12px;

            padding:
                12px 14px;

            border-radius:
                12px;

            background:
                #fff1ef;

            border:
                1px solid #edc5bf;

            color:
                #9c382f;
        }


        .agri-weather-result {

            display:
                none;

            margin-top:
                26px;
        }


        .agri-selected {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                16px;

            padding:
                18px 20px;

            border-radius:
                18px;

            background:
                linear-gradient(
                    135deg,
                    #1d6b39,
                    #2d8d4e
                );

            color:
                white;
        }


        .agri-selected strong {

            display:
                block;

            font-size:
                22px;
        }


        .agri-selected span {

            opacity:
                .82;

            font-size:
                12px;
        }


        .agri-weather-main {

            display:
                grid;

            grid-template-columns:
                1.1fr .9fr;

            gap:
                16px;

            margin-top:
                16px;
        }


        .agri-temp-card,
        .agri-advice {

            background:
                var(--agri-surface);

            border:
                1px solid var(--agri-border);

            border-radius:
                20px;

            box-shadow:
                var(--agri-shadow);

            padding:
                24px;
        }


        .agri-temp-row {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;
        }


        .agri-temp {

            font-size:
                76px;

            font-weight:
                900;

            line-height:
                1;

            color:
                var(--agri-green-2);
        }


        .agri-condition {

            font-size:
                18px;

            font-weight:
                800;

            margin-top:
                8px;
        }


        .agri-weather-icon {

            font-size:
                72px;
        }


        .agri-metrics {

            display:
                grid;

            grid-template-columns:
                repeat(4,1fr);

            gap:
                10px;

            margin-top:
                15px;
        }


        .agri-metric {

            padding:
                14px;

            border-radius:
                14px;

            background:
                var(--agri-surface-2);

            border:
                1px solid var(--agri-border);
        }


        .agri-metric small {

            display:
                block;

            color:
                var(--agri-muted);
        }

                grid-template-columns:
                    1fr;

        /* =========================================================

            *::before,
            *::after {

                animation:
                    none !important;

                transition:
                    none !important;

                scroll-behavior:
                    auto !important;
            }
        }

<body>


    <!-- =========================================================

        class="agri-page {% block page_class %}{% endblock %}"

    <!-- =========================================================
     REAL GRASS — STAYS BELOW CONTENT
========================================================= -->

<div
    class="agri-grass-stage"
    id="agriGrassStage"
    aria-hidden="true"
>

    <canvas id="agriGrassCanvas"></canvas>

{% endblock %}


<!-- =========================================================
     GRASS CSS
========================================================= -->

<style>

/* =========================================================
   GRASS — SEAMLESS WITH PAGE
========================================================= */

.agri-grass-stage {
    position: relative;

    width: 100%;
    height: 82px;

    overflow: hidden;

    pointer-events: none;

    margin: 0;

    /*
       IMPORTANT:
       Same background as the page.
       This removes the white strip.
    */
    background: var(--agri-bg);

    z-index: 1;
}


#agriGrassCanvas {
    display: block;

    width: 100%;
    height: 100%;

    pointer-events: none;

    background: transparent;
}


/* =========================================================
   FOOTER — SAME SURFACE AS PAGE
========================================================= */

.agri-footer {
    position: relative;

    margin: 0;

    padding:
        22px 20px 28px;

    text-align: center;

    color: var(--agri-muted);

    /*
       Same background as grass area.
       No white block.
    */
    background: var(--agri-bg);

    border-top: 0;

    z-index: 2;

    transition:
        background .7s ease,
        color .7s ease;
}


/* =========================================================
   DARK MODE
========================================================= */

body.dark .agri-grass-stage {
    background: var(--agri-bg);
}


body.dark .agri-footer {
    background: var(--agri-bg);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 760px) {

    .agri-grass-stage {
        height: 72px;
    }

    .agri-footer {
        padding:
            20px 16px 25px;
    }

}

</style>

<!-- =========================================================
     GRASS JAVASCRIPT
========================================================= -->

<script>

(function () {

    "use strict";


    const canvas =
        document.getElementById(
            "agriGrassCanvas"
        );


    const stage =
        document.getElementById(
            "agriGrassStage"
        );


    if (!canvas || !stage) return;


    const ctx =
        canvas.getContext("2d");


    let width = 0;

    let height = 0;

    let dpr = 1;

    let blades = [];

    let mouseX = -1000;

    let mouseActive = false;


    /* =========================================================
       RESIZE
    ========================================================= */

    function resize() {

        const rect =
            stage.getBoundingClientRect();


        width =
            Math.max(
                1,
                Math.floor(rect.width)
            );


        height =
            Math.max(
                1,
                Math.floor(rect.height)
            );


        dpr =
            Math.min(
                window.devicePixelRatio || 1,
                2
            );


        canvas.width =
            width * dpr;


        canvas.height =
            height * dpr;


        canvas.style.width =
            width + "px";


        canvas.style.height =
            height + "px";


        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );


        createBlades();

    }


    /* =========================================================
       CREATE GRASS BLADES
    ========================================================= */

    function createBlades() {

        blades = [];


        const spacing =
            width < 600
                ? 6
                : 5;


        for (
            let x = -10;
            x <= width + 10;
            x += spacing
        ) {

            blades.push({

                x: x,

                height:
                    32 +
                    Math.random() * 48,

                width:
                    2 +
                    Math.random() * 2.5,

                bend: 0,

                velocity: 0,

                phase:
                    Math.random() *
                    Math.PI *
                    2,

                sway:
                    0.015 +
                    Math.random() * 0.025,

                opacity:
                    0.42 +
                    Math.random() * 0.48

            });

        }

    }


    /* =========================================================
       CURSOR
    ========================================================= */

    window.addEventListener(
        "mousemove",
        function (event) {

            const rect =
                stage.getBoundingClientRect();


            mouseX =
                event.clientX -
                rect.left;


            mouseActive =
                mouseX >= -100 &&
                mouseX <= width + 100;

        },
        {
            passive: true
        }
    );


    window.addEventListener(
        "mouseleave",
        function () {

            mouseActive = false;

        }
    );


    /* =========================================================
       DRAW ONE GRASS BLADE
    ========================================================= */

    function drawBlade(
        blade,
        time
    ) {

        const baseX =
            blade.x;


        const baseY =
            height + 8;


        /* Natural breeze */

        const naturalWind =
            Math.sin(
                time * blade.sway +
                blade.phase
            ) * 3;


        /* Cursor force */

        let cursorForce = 0;


        if (mouseActive) {

            const distance =
                mouseX -
                baseX;


            const influence =
                Math.max(
                    0,
                    1 -
                    Math.abs(distance) /
                    150
                );


            cursorForce =
                Math.sign(distance) *
                influence *
                24;

        }


        /* Smooth bending */

        const target =
            naturalWind +
            cursorForce;


        blade.velocity +=
            (target - blade.bend) *
            0.045;


        blade.velocity *=
            0.88;


        blade.bend +=
            blade.velocity;


        const bend =
            blade.bend;


        const tipX =
            baseX +
            bend;


        const tipY =
            baseY -
            blade.height;


        const controlX =
            baseX +
            bend * 0.45;


        const controlY =
            baseY -
            blade.height * 0.52;


        /* =====================================================
           GRASS GRADIENT
        ===================================================== */

        const gradient =
            ctx.createLinearGradient(
                baseX,
                baseY,
                tipX,
                tipY
            );


        gradient.addColorStop(
            0,
            `rgba(
                25,
                105,
                42,
                ${blade.opacity}
            )`
        );


        gradient.addColorStop(
            0.55,
            `rgba(
                59,
                145,
                69,
                ${blade.opacity}
            )`
        );


        gradient.addColorStop(
            1,
            `rgba(
                111,
                180,
                111,
                ${blade.opacity * 0.72}
            )`
        );


        /* =====================================================
           GRASS BLADE
        ===================================================== */

        ctx.beginPath();


        ctx.moveTo(
            baseX - blade.width,
            baseY
        );


        ctx.quadraticCurveTo(
            controlX - blade.width,
            controlY,
            tipX,
            tipY
        );


        ctx.quadraticCurveTo(
            controlX + blade.width,
            controlY,
            baseX + blade.width,
            baseY
        );


        ctx.closePath();


        ctx.fillStyle =
            gradient;


        ctx.fill();


        /* =====================================================
           LIGHT CENTER LINE
        ===================================================== */

        ctx.beginPath();


        ctx.moveTo(
            baseX,
            baseY
        );


        ctx.quadraticCurveTo(
            controlX,
            controlY,
            tipX,
            tipY
        );


        ctx.strokeStyle =
            `rgba(
                143,
                205,
                139,
                ${blade.opacity * 0.42}
            )`;


        ctx.lineWidth =
            0.7;


        ctx.stroke();

    }


    /* =========================================================
       ANIMATION
    ========================================================= */

    function draw(time) {

        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        blades.forEach(
            function (blade) {

                ctx.globalAlpha =
                    0.42;


                drawBlade(
                    blade,
                    time
                );

            }
        );


        ctx.globalAlpha =
            1;


        requestAnimationFrame(
            draw
        );

    }


    /* =========================================================
       START
    ========================================================= */

    resize();


    window.addEventListener(
        "resize",
        resize
    );


    requestAnimationFrame(
        draw
    );

})();

</script>


</body>
