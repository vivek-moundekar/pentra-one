<form method="post" action="{% url 'agriculture:set_language' %}" class="agri-language-form">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><span>🌐</span><select name="language" onchange="this.form.submit()" aria-label="{{ ui.nav.language|default:'Language' }}"><option value="en" {% if language == 'en' %}selected{% endif %}>English</option><option value="hi" {% if language == 'hi' %}selected{% endif %}>हिन्दी</option><option value="mr" {% if language == 'mr' %}selected{% endif %}>मराठी</option><option value="gu" {% if language == 'gu' %}selected{% endif %}>ગુજરાતી</option><option value="bn" {% if language == 'bn' %}selected{% endif %}>বাংলা</option><option value="ta" {% if language == 'ta' %}selected{% endif %}>தமிழ்</option><option value="te" {% if language == 'te' %}selected{% endif %}>తెలుగు</option><option value="kn" {% if language == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option><option value="pa" {% if language == 'pa' %}selected{% endif %}>ਪੰਜਾਬੀ</option></select></form>
