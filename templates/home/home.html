<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentra One</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background:
                radial-gradient(circle at 50% 38%, rgba(73,126,95,.12), transparent 30%),
                linear-gradient(145deg, #fffaf0 0%, #f3ead8 50%, #e6efe7 100%);
        }
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        body::before {
            width: 430px; height: 430px; left: -170px; top: -170px;
            background: rgba(73,126,95,.08);
            filter: blur(8px);
            animation: floatOne 8s ease-in-out infinite;
        }
        body::after {
            width: 370px; height: 370px; right: -140px; bottom: -140px;
            background: rgba(193,154,107,.08);
            filter: blur(8px);
            animation: floatTwo 9s ease-in-out infinite;
        }
        .startup {
            width: 100%; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px; position: relative; z-index: 2;
        }
        .startup-content {
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .brand {
            display: inline-flex; align-items: baseline; white-space: nowrap;
            filter: drop-shadow(0 12px 30px rgba(0,0,0,.22));
        }
        .pentra {
            font-family: "Berlin Sans FB Demi","Berlin Sans FB","Arial Black",sans-serif;
            font-size: clamp(58px,10vw,126px);
            font-weight: 600; letter-spacing: 1px;
            color: #214f3d;
            text-transform: uppercase;
            opacity: 0;
            transform: translateX(-45px) scale(.94);
            filter: blur(8px);
            animation: showPentra .9s cubic-bezier(.2,.8,.2,1) forwards;
            animation-delay: .35s;
        }
        .one {
            font-family: "Bell MT","Times New Roman",serif;
            font-size: clamp(44px,7vw,88px);
            font-style: italic; font-weight: 400;
            color: #7b5a32;
            margin-left: 8px;
            transform: translateX(45px) translateY(-2px) scale(.94);
            opacity: 0;
            filter: blur(8px);
            animation: showOne .9s cubic-bezier(.2,.8,.2,1) forwards;
            animation-delay: 1.15s;
        }
        .brand-line {
            width: 0; height: 3px; margin: 18px auto 0; border-radius: 99px;
            background: linear-gradient(90deg, transparent, #4f7f62 50%, transparent);
            animation: lineGrow .7s ease forwards;
            animation-delay: 1.8s;
        }
        .start-button {
            margin-top: 54px; min-width: 190px; padding: 15px 34px;
            border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
            background: linear-gradient(135deg, #3f7559, #2d5f47);
            color: #ffffff;
            text-decoration: none;
            font-family: Arial,sans-serif; font-size: 15px; font-weight: 800;
            letter-spacing: 3px;
            box-shadow: 0 12px 32px rgba(63,117,89,.22), inset 0 1px 0 rgba(255,255,255,.18);
            opacity: 0; transform: translateY(18px);
            animation: buttonIntro .65s ease forwards;
            animation-delay: 2.25s;
            transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
        }
        .start-button:hover {
            transform: translateY(-3px);
            filter: brightness(1.06);
            box-shadow: 0 18px 40px rgba(63,117,89,.30), inset 0 1px 0 rgba(255,255,255,.22);
        }
        .start-button:active { transform: translateY(0); }
        .pulse-ring {
            position: absolute; width: 470px; height: 470px;
            border: 1px solid rgba(63,117,89,.14);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
            pointer-events: none; z-index: -1;
        }
        .glow {
            position: absolute; width: 250px; height: 250px; border-radius: 50%;
            background: rgba(63,117,89,.08);
            filter: blur(40px); z-index: -2;
            animation: glowPulse 3.8s ease-in-out infinite;
        }
        @keyframes showPentra {
            0% { opacity: 0; transform: translateX(-45px) scale(.94); filter: blur(8px); }
            100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
        }
        @keyframes showOne {
            0% { opacity: 0; transform: translateX(45px) translateY(-2px) scale(.94); filter: blur(8px); }
            100% { opacity: 1; transform: translateX(0) translateY(-2px) scale(1); filter: blur(0); }
        }
        @keyframes lineGrow { to { width: min(370px,72vw); } }
        @keyframes buttonIntro { to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse {
            0%,100% { transform: scale(.92); opacity: .25; }
            50% { transform: scale(1.08); opacity: .7; }
        }
        @keyframes glowPulse {
            0%,100% { transform: scale(.9); opacity: .4; }
            50% { transform: scale(1.12); opacity: .75; }
        }
        @keyframes floatOne {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(35px,24px); }
        }
        @keyframes floatTwo {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(-28px,-20px); }
        }
        @media (max-width:600px) {
            .one { margin-left: 4px; }
            .brand-line { margin-top: 12px; }
            .start-button { margin-top: 42px; min-width: 165px; padding: 14px 28px; }
            .pulse-ring { width: 310px; height: 310px; }
            .glow { width: 190px; height: 190px; }
        }
    </style>
</head>
<body>
    <main class="startup">
        <div class="pulse-ring"></div>
        <div class="glow"></div>
        <div class="startup-content">
            <div class="brand">
                <span class="pentra">PENTRA</span>
                <span class="one">one</span>
            </div>
            <div class="brand-line"></div>
            <a href="/dashboard/" class="start-button">START</a>
        </div>
    </main>
</body>
</html>
