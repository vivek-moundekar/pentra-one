<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sell Your Products - PentraOne</title>
    <style>
        body { font-size: 17px; }
        h1 { font-size: 32px !important; }
        h2 { font-size: 22px !important; }
        p { font-size: 16px !important; line-height: 1.6 !important; }
        button, .lang-btn, .quiz-btn, .learn-btn { font-size: 16px !important; padding: 10px 18px !important; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #FFF3E0; margin: 0; padding: 30px; }
        h1 { text-align: center; color: #E65100; margin-bottom: 10px; }
        .back-link { text-align: center; margin-bottom: 10px; }
        .back-link a { color: #E65100; text-decoration: none; font-size: 14px; }
        .lang-row { text-align: center; margin-bottom: 15px; }
        .lang-row button { margin: 0 4px; padding: 6px 14px; border-radius: 16px; border: 1px solid #FFCC80; background: white; cursor: pointer; }
        .tips-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .tip-card { background-color: #FFFFFF; border: 2px solid #FFE0B2; border-radius: 16px; padding: 20px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .tip-icon { font-size: 32px; margin-bottom: 8px; }
        .tip-card h2 { color: #EF6C00; margin-top: 0; font-size: 20px; }
        .tip-card p { font-size: 15px; color: #333; line-height: 1.5; }
        .video-btn {
    display: block;
    margin-top: 12px;
    background-color: #C62828;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    width: 100%;
}
.video-btn:hover {
    background-color: #B71C1C;
}
    </style>
</head>
<body>

    <div class="back-link"><a href="/women-skills/">⬅ Back to Hub</a></div>
    <div class="lang-row">
        <button onclick="setLang('en')">English</button>
        <button onclick="setLang('hi')">हिंदी</button>
        <button onclick="setLang('mr')">मराठी</button>
    </div>

    <h1>🛍 Sell Your Products</h1>

    <div class="tips-container">
        {% for tip in tips %}
            <div class="tip-card">
               {% if tip.image_url %}
    <img src="{{ tip.image_url }}" style="width:100%; border-radius:10px; margin-bottom:10px;">
{% endif %}
<div class="tip-icon">{{ tip.icon }}</div>
                <h2 class="tip-title" data-en="{{ tip.title }}" data-hi="{{ tip.title_hi }}" data-mr="{{ tip.title_mr }}">{{ tip.title }}</h2>
                <p class="tip-desc" data-en="{{ tip.description }}" data-hi="{{ tip.description_hi }}" data-mr="{{ tip.description_mr }}">{{ tip.description }}</p>
                          {% if tip.video_url %}
    <button class="video-btn" onclick="openVideo('{{ tip.video_url }}', '{{ tip.title }}')">🎥 Watch Video</button>
{% endif %}
            </div>
        {% endfor %}
    </div>

    <script>
        function setLang(lang) {
            document.querySelectorAll('.tip-title, .tip-desc').forEach(function(el) {
                const text = el.getAttribute('data-' + lang);
                if (text) { el.innerText = text; }
            });
        }
    </script>
<div class="modal-overlay" id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#FFF3E0; justify-content:center; align-items:center; z-index:1000;">
    <div style="background:white; border-radius:16px; padding:20px; width:450px; max-width:90%; position:relative; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
        <button onclick="closeVideo()" style="position:absolute; top:10px; right:14px; background:none; border:none; font-size:20px; cursor:pointer; color:#E65100;">✖</button>
        <h3 id="videoModalTitle" style="color:#E65100; margin-top:0;"></h3>
        <div id="videoModalContent"></div>
    </div>
</div>

<script>
function openVideo(videoUrl, title) {
    const vid = videoUrl.slice(-11);
    document.getElementById('videoModalTitle').innerText = '🎥 ' + title;
    document.getElementById('videoModalContent').innerHTML = `
        <a href="https://www.youtube.com/watch?v=${vid}" target="_blank" style="display:block; position:relative;">
            <img src="https://img.youtube.com/vi/${vid}/hqdefault.jpg" style="width:100%; border-radius:10px;">
            <span style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.6); color:white; padding:10px 16px; border-radius:50%; font-size:20px;">▶</span>
        </a>
        <p style="text-align:center; font-size:13px; color:#666; margin-top:8px;">Click to watch on YouTube</p>
    `;
    document.getElementById('videoModal').style.display = 'flex';
}
function closeVideo() {
    document.getElementById('videoModal').style.display = 'none';
}
</script>
</body>
</html>
